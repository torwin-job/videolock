# Drop-in fragment for ~/.config/hypr/hypridle.conf
# Or run: ./install.sh --hypridle

$LOCK_CMD = $HOME/.local/bin/videolock.sh
$UNLOCK_CMD = $HOME/.local/bin/videolock-unlock.sh

general {
    lock_cmd = $LOCK_CMD
    unlock_cmd = $UNLOCK_CMD
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

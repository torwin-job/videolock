# Classic hyprland.conf binds
# IMPORTANT: only ONE Super+L path. Do NOT also bind Super+L → loginctl lock-session.
# Idle/lid locks go through hypridle $LOCK_CMD (same videolock.sh).

# Lock (bindl = also works while already locked / from lock context)
bindl = SUPER, L, exec, $HOME/.local/bin/videolock.sh

# Layout switch MUST use bindl — plain `bind` is dead on the lock screen
bindl = SUPER, SPACE, exec, hyprctl switchxkblayout current next

# Optional: XKB Alt+Shift also works under lock (no bind needed):
# input { kb_layout = us,ru; kb_options = grp:alt_shift_toggle; }

# Crash recovery (optional keybind):
# bind = SUPER SHIFT, L, exec, $HOME/.local/bin/videolock --recover
